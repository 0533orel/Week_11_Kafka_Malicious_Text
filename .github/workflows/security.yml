name: Credential hygiene
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r services/retriever/requirements.txt PyYAML==6.0.2
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks.tar.gz
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          hash=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' checksums.txt)
          test -n "$hash"
          echo "$hash  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan tree and introduced commits without secret output
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact=100 --no-banner --log-level error --max-archive-depth 3
          head="${PR_HEAD:-$GITHUB_SHA}"
          base="${PR_BASE:-$EVENT_BEFORE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base=$(git rev-parse "$head^")
          fi
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact=100 --no-banner --log-level error --log-opts="$base..$head"
